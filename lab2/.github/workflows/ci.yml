name: CI Cipher Module Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python 3.10 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography

      - name: 1MB-os tesztfájl generálása (test.jpg)
        run: |
          head -c 1048576 /dev/urandom > test.jpg

      - name: Pytest unit tesztek futtatása
        run: |
          pytest -v

      - name: Teljes 10 tesztesetes főprogram futtatása
        run: |
          python tombtitkositok.py
