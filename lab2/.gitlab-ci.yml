image: python:3.10

stages:
  - test

run_tests:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install pytest cryptography
  script:
    - head -c 1048576 /dev/urandom > test.jpg # 1MB-os tesztfájl generálása a futtatáshoz
    - pytest -v
    - python tombtitkositok.py # A 10 konfig fájlos főprogram tesztelése
