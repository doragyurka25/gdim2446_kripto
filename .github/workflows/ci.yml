name: CI Cipher Module Tests

on:
  push:
    branches: ["main", "master", "lab2"]
  pull_request:
    branches: ["main", "master", "lab2"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography

      # ITT A LÉNYEG: A lab2 mappába lépünk, ha ott vannak a fájlok
      - name: Tesztek és főprogram futtatása a lab2 mappában
        run: |
          cd lab2
          head -c 1048576 /dev/urandom > test.jpg
          pytest -v test_cipher.py
          python tombtitkositok.py
